# Canary slice: {{WEIGHT}}% of /canary/ requests go to the canary track.
# 'X-Canary: always' forces the canary, 'X-Canary: never' the stable track (for testing).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "{{WEIGHT}}"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /canary
            pathType: Prefix
            backend:
              service:
                name: aceest-canary
                port:
                  number: 80
