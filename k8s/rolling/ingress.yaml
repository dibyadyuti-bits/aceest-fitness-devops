# Rolling update: users reach the aceest-main Deployment at /rolling/.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest
  annotations:
    kubernetes.io/description: "Rolling update: pods replaced one at a time"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /rolling
            pathType: Prefix
            backend:
              service:
                name: aceest-main
                port:
                  number: 80
