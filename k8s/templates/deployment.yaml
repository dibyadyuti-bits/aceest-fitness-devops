# One track (main / blue / green / stable / canary / a / b / primary / shadow) of the app.
# Rendered by k8s/release.sh: {{TRACK}}, {{IMAGE}}, {{REPLICAS}} and {{PREFIX}} are replaced
# before kubectl apply, so do not apply this file directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-{{TRACK}}
  labels:
    app: aceest
    track: "{{TRACK}}"
spec:
  replicas: {{REPLICAS}}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # one extra pod at a time
      maxUnavailable: 0    # never drop below the desired count: zero downtime
  selector:
    matchLabels:
      app: aceest
      track: "{{TRACK}}"
  template:
    metadata:
      labels:
        app: aceest
        track: "{{TRACK}}"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: {{IMAGE}}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            # Gunicorn strips this prefix, so the app answers under /<strategy>/ and the
            # ingress needs no rewrite rules.
            - name: SCRIPT_NAME
              value: "{{PREFIX}}"
            - name: APP_VARIANT
              value: "{{TRACK}}"
            - name: ACEEST_DB
              value: /data/aceest_fitness.db
          readinessProbe:
            httpGet:
              path: "{{PREFIX}}/health"
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "{{PREFIX}}/health"
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # SQLite per pod: fine for demonstrating the release strategies; use a shared
        # database (e.g. PostgreSQL) for real multi-replica persistence.
        - name: data
          emptyDir: {}
