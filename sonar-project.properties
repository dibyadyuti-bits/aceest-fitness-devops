# SonarCloud analysis for ACEest Fitness & Gym.
# https://sonarcloud.io/project/overview?id=dibyadyuti-bits_aceest-fitness-devops
# The token comes from the SONAR_TOKEN secret (GitHub) / 'sonarcloud-token' credential (Jenkins).
sonar.host.url=https://sonarcloud.io
sonar.organization=dibyadyuti-bits
sonar.projectKey=dibyadyuti-bits_aceest-fitness-devops
sonar.projectName=ACEest Fitness & Gym

# SonarCloud now analyses the whole repository and ignores sonar.sources/sonar.tests,
# so the scope is set with exclusions: only the Flask app (aceest/, app.py,
# ACEest_Fitness.py) is graded. tests/ is detected as test code automatically.
# legacy/ holds the original Tkinter prototypes (reference only); the deployment
# and pipeline files are checked by flake8/shellcheck/the Docker build instead.
sonar.exclusions=legacy/**,k8s/**,docs/**,.github/**,Dockerfile,Jenkinsfile
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Written by: pytest --junitxml=reports/junit.xml --cov --cov-report=xml:reports/coverage.xml
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# Fail the scanner (and so the pipeline) when the quality gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
