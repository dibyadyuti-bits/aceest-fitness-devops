name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile (syntax check)
        run: python -m compileall -q aceest app.py ACEest_Fitness.py tests

      - name: Lint with flake8
        run: flake8 .

      - name: Lint the Kubernetes release script with shellcheck
        run: shellcheck k8s/release.sh

  test-and-quality:
    name: Pytest & SonarCloud Quality Gate
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code (full history for SonarCloud)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Pytest with coverage
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --cov --cov-report=term --cov-report=xml:reports/coverage.xml

      - name: Check for the SonarCloud token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SONAR_TOKEN secret is not set; SonarCloud analysis skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # sonar-project.properties sets sonar.qualitygate.wait=true: a failed gate fails this job.
      - name: SonarCloud scan and quality gate
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build-and-test:
    name: Docker Build & Test
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build test image
        run: docker build --target test -t aceest-fitness:test .

      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness:test

      - name: Build runtime image
        run: |
          docker build --target runtime --build-arg APP_VERSION="$(cat VERSION)" \
            -t aceest-fitness:${{ github.sha }} .

      - name: Smoke test the running container
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && break
            sleep 2
          done
          curl -fs http://localhost:5000/api/programs
          curl -fs http://localhost:5000/version | tee version.json
          grep -q "\"version\":\"$(cat VERSION)\"" version.json

      - name: Show logs and clean up
        if: always()
        run: |
          docker logs aceest || true
          docker rm -f aceest || true

  publish-image:
    name: Publish image to Docker Hub (release tags)
    needs: [test-and-quality, docker-build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Check for Docker Hub secrets
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are not set; image not published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.creds.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: APP_VERSION=${{ steps.creds.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:${{ steps.creds.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:latest
